name: Verifier Gate Refresh

on:
  pull_request:
    types:
      - edited
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: verifier-gate-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh-verifier-gate:
    name: Refresh Verifier Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Rerun baseline verifier gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          event_path = os.environ["GITHUB_EVENT_PATH"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          with open(event_path, "r", encoding="utf-8") as handle:
              event = json.load(handle)

          event_pull_request = event.get("pull_request") or {}
          pr_number = event.get("number") or event_pull_request.get("number")
          errors = []

          def fail(message):
              errors.append(message)

          def request_json(url, description):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "verifier-gate-refresh",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  fail(f"{description}: GitHub API returned HTTP {exc.code}.")
              except urllib.error.URLError as exc:
                  fail(f"{description}: {exc.reason}.")
              return None

          def post_rerun(run_id):
              url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/rerun"
              request = urllib.request.Request(
                  url,
                  data=b"",
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "verifier-gate-refresh",
                  },
              )
              try:
                  with urllib.request.urlopen(request):
                      return True
              except urllib.error.HTTPError as exc:
                  fail(f"Unable to rerun baseline Verifier Gate: GitHub API returned HTTP {exc.code}.")
              except urllib.error.URLError as exc:
                  fail(f"Unable to rerun baseline Verifier Gate: {exc.reason}.")
              return False

          if not pr_number:
              fail("Unable to determine pull request number.")

          current_pull_request = None
          if not errors:
              current_pull_request = request_json(
                  f"https://api.github.com/repos/{repository}/pulls/{pr_number}",
                  "Unable to read current pull request",
              )

          current_pull_request = current_pull_request or {}
          head_sha = ((current_pull_request.get("head") or {}).get("sha") or "")
          if not head_sha:
              fail("Unable to determine current pull request head SHA.")

          baseline = None
          if not errors:
              query = urllib.parse.urlencode(
                  {"event": "pull_request", "head_sha": head_sha, "per_page": 100}
              )
              runs = request_json(
                  f"https://api.github.com/repos/{repository}/actions/workflows/verifier-gate.yml/runs?{query}",
                  "Unable to list baseline Verifier Gate runs",
              )
              runs = (runs or {}).get("workflow_runs") or []
              matches = []
              for run in runs:
                  if run.get("event") != "pull_request":
                      continue
                  if (run.get("head_sha") or "").lower() != head_sha.lower():
                      continue
                  linked_prs = run.get("pull_requests") or []
                  if not any(linked_pr.get("number") == pr_number for linked_pr in linked_prs):
                      continue
                  matches.append(run)
              if not matches:
                  fail("No baseline Verifier Gate pull_request run exists for the current pull request head SHA.")
              else:
                  baseline = max(matches, key=lambda run: run.get("id") or 0)

          if not errors and baseline:
              run_id = baseline.get("id")
              if not run_id:
                  fail("Baseline Verifier Gate run has no run ID.")
              else:
                  current_run = baseline
                  for _ in range(30):
                      if (current_run.get("status") or "") == "completed":
                          break
                      time.sleep(2)
                      current_run = request_json(
                          f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
                          "Unable to read baseline Verifier Gate run",
                      ) or {}
                      if errors:
                          break
                  else:
                      fail("Baseline Verifier Gate did not reach completed state before refresh timeout.")
                  if not errors:
                      post_rerun(run_id)

          if errors:
              print("Verifier Gate Refresh: FAIL")
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("Verifier Gate Refresh: PASS")
          print(f"PR: #{pr_number}")
          print(f"Current head SHA: {head_sha}")
          print(f"Rerun baseline workflow run: {baseline['id']}")
          PY
