name: Verifier Gate

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-verifier-evidence:
    name: Validate Verifier Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Load trusted verifier code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          base_sha = os.environ["BASE_SHA"]
          root = pathlib.Path("/tmp/trusted-governance")
          files = [
              "scripts/governance/common.py",
              "scripts/governance/contract_gate.py",
              "scripts/governance/verifier_gate.py",
          ]
          for path in files:
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={base_sha}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "trusted-verifier-bootstrap",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(payload["content"]))
          PY
      - name: Validate verifier evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: >-
          PYTHONPATH=/tmp/trusted-governance
          python3 /tmp/trusted-governance/scripts/governance/verifier_gate.py
